<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Health API Starter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; background: #fff; }
    button, select, input { font: inherit; padding: .4rem .8rem; }
    button { cursor: pointer; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
    #status { font-weight: 600; }
    #error { color: #b00020; white-space: pre-wrap; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; max-height: 60vh; font-size: .85rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Google Health API Starter</h1>

  <p id="status">Loading…</p>

  <div class="row">
    <button id="sign-in">Sign in with Google</button>
    <button id="sign-out" hidden>Sign out</button>
  </div>

  <div id="app" hidden>
    <div class="row">
      <label>Data type
        <select id="data-type">
          <option value="exercise">exercise</option>
          <option value="steps">steps</option>
        </select>
      </label>
      <label>Last <input id="days" type="number" value="7" min="1" style="width: 4rem"> days</label>
      <button id="load">Load data</button>
    </div>
  </div>

  <p id="error"></p>
  <pre id="output" hidden></pre>

  <!-- Order matters: the library, then your settings, then your app. -->
  <script src="google-auth.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
